<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk Register ISO 31000</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#5d6b7c;--bd:#dde2e8;--pr:#1f5fbf;--pr-t:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#98a5b5;--bd:#2d3744;--pr:#5b9bff;--pr-t:#0b1220}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#98a5b5;--bd:#2d3744;--pr:#5b9bff;--pr-t:#0b1220}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 20px 0;max-width:1200px;margin:auto}
h1{font-size:20px;margin:0}header p{margin:2px 0 12px;color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--mu);font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--pr);border-color:var(--pr);font-weight:600}
main{max-width:1200px;margin:auto;padding:16px 20px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 10px}.card h3{font-size:13px;margin:16px 0 8px;color:var(--pr);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:60px;resize:vertical}
.btn{background:var(--pr);color:var(--pr-t);border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}.btn:disabled{opacity:.4}
.btn.s{background:none;color:var(--pr);border:1px solid var(--pr)}.btn.d{background:none;color:#d33a3a;border:1px solid #d33a3a}
.btn.sm{padding:4px 9px;font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;color:#222}
.L1{background:#00b050;color:#fff}.L2{background:#92d050}.L3{background:#ffff00}.L4{background:#ffc000}.L5{background:#ff0000;color:#fff}
.st{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.kpi b{font-size:26px;display:block}.kpi span{font-size:12px;color:var(--mu)}
.hm{display:grid;grid-template-columns:auto repeat(5,minmax(62px,1fr));gap:4px;max-width:680px}
.hm .ax{display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:11px;text-align:center}
.hm .c{display:flex;flex-wrap:wrap;align-content:flex-start;position:relative;min-height:66px;padding:3px;border-radius:6px;color:#222;cursor:pointer}
.hm .c.sel{outline:3px solid var(--tx)}.sc{position:absolute;right:5px;bottom:2px;font-size:12px;font-weight:700;opacity:.65}
.ch{background:rgba(255,255,255,.88);color:#222;border:1px solid #555;border-radius:10px;padding:0 6px;font-size:10px;font-weight:600;margin:1px;height:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu);font-size:13px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.empty{color:var(--mu);padding:12px 0}.bar{height:10px;border-radius:5px;display:inline-block;vertical-align:middle}
.ck{display:inline-block;margin-right:12px;color:var(--tx);font-size:13px}.ck input{width:auto}
.adm .ua{display:none}
</style>
</head>
<body>
<header>
<h1>Risk Register &amp; Usulan Profil Risiko</h1>
<p id="sub"></p>
<div id="ub" class="row" style="margin-bottom:8px"></div>
<nav id="nav"></nav>
</header>
<main id="app"></main>
<script>
var KEY="rr_iso31000_v3";
var M=[[1,3,5,9,20],[2,7,10,13,21],[4,8,14,17,22],[6,12,16,19,24],[11,15,18,23,25]];
var LN=["","Sangat Rendah","Rendah","Sedang","Tinggi","Sangat Tinggi"];
var KU=["Keuangan","Reputasi","Hukum","Kecelakaan Kerja","Layanan","Kinerja","SPBE","Kemitraan"];
var KK=["Kerugian Keuangan Negara","Suap Menyuap","Penggelapan dalam Jabatan/Penyalahgunaan Wewenang","Pemerasan","Perbuatan Curang","Benturan Kepentingan dalam Pengadaan","Gratifikasi","Benturan Kepentingan","Merintangi Pemeriksaan","Pemberian Keterangan Palsu","Tindak Pidana Pencucian Uang"];
var AD=["Keuangan Negara","Reputasi","Hukum","Kecelakaan dan Penyakit Akibat Kerja","Gangguan Layanan Organisasi","Penurunan Kinerja"];
var SUM=["Sasaran organisasi UPR","Risiko UPR tingkat lebih tinggi (top-down)","Laporan pengawasan/pemeriksaan","BDKK","Pendapat ahli","Data pembanding (benchmark)","Usulan UPR di bawahnya (bottom-up)","Tinjauan risiko baru/belum teridentifikasi"];
var BK=["Pendidikan","Pencegahan","Pengawasan dan penindakan"];
var PC=["Halus (soft control)","Keras (hard control)"];
var KEG=["Perencanaan dan Kerja Sama","Pengelolaan dan Pengadministrasian Pegawai, Organisasi dan Tatalaksana","Pengelolaan Keuangan dan BMN","Pembinaan Pengadaan Jasa Konstruksi","Dukungan Manajemen Sekretariat Jenderal","Pembentukan dan Evaluasi Peraturan Perundang-Undangan serta Advokasi Hukum","Penyelenggaraan dan Pembinaan Informasi Publik","Pengelolaan Data dan Teknologi Informasi","Penyelenggaraan Pengembangan Kompetensi","Penyelenggaraan Pengembangan Talenta"];
var LK=["Hampir tidak terjadi","Jarang terjadi","Kadang terjadi","Sering terjadi","Hampir pasti terjadi"];
var DP=["Tidak Signifikan","Minor","Moderat","Signifikan","Sangat Signifikan"];
var RESP=["Mengurangi kemungkinan","Mengurangi dampak","Membagi risiko","Menghindari","Menerima"];
var RJ=["Penguatan","Inovasi","Eskalasi"];
var SD=["Man","Method","Money","Machine","Material"];
var HN=["Memadai","Belum Memadai"];
var ALAT=["Dokumen","Laporan","Keterangan saksi","Petunjuk","Keterangan ahli"];
var JS=["Kesempatan","Tekanan","Rasionalisasi","Kapabilitas","Arogansi"];
var STAT={baru:"Teridentifikasi",usul:"Diusulkan",pantau:"Dipantau di register",ajuan:"Menunggu verifikasi",profil:"Ditetapkan di profil"};
var S={risks:[],bd:[],th:10,tab:"dash",edit:null,cell:null,c:{lvl:"UPR-T1",unit:"Sekretariat Jenderal",per:"2026",own:"Sekretaris Jenderal",mgr:"Kepala Biro Keuangan dan BMN",tuj:"Tercapainya Tingkat Kualitas Dukungan Manajemen Kementerian PKP sebesar 84%"}};
function dflt(r){return Object.assign({keg:KEG[0],ev:"",cause:"",impact:"",kat:KU[0],ctrl:"",hn:HN[1],l:3,i:3,resp:RESP[0],rj:RJ[0],ru:"",rs:[],l2:2,i2:2,pj:"",wk:"",ik:"",sp:"",ph:"",ab:ALAT[0],js:JS[0],rf:"",ad:AD[5],ukl:"",ukd:"",sum:SUM[0],bk:BK[1],pc:PC[1],status:"baru"},r)}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null"),old=false;if(!d){d=JSON.parse(localStorage.getItem("rr_iso31000_v2")||"null");old=true}if(d&&d.risks){S.risks=d.risks.map(function(r){return dflt(r)});S.th=old?Math.max((d.th||11)-1,5):(d.th||10);S.bd=d.bd||[];S.c=Object.assign(S.c,d.c||{});return}}catch(e){}
S.risks=[
{id:"R1",keg:KEG[2],ev:"Keterlambatan penetapan status penggunaan (PSP) BMN",kat:"Kinerja",cause:"Masih terdapat ketidaksesuaian kelengkapan dokumen pada permohonan usulan",impact:"Target kinerja pada renstra Sekjen Kementerian PKP tidak tercapai",ctrl:"PMK No. 40 Tahun 2024; surat KPKNL; pendampingan dan bimtek aplikasi SIMAN",hn:HN[1],l:4,i:5,resp:"Mengurangi kemungkinan, Mengurangi dampak",rj:"Penguatan",ru:"1. Buku saku panduan pengusulan PSP 2. Klinik BMN (pendampingan PSP)",rs:["Method"],l2:2,i2:3,pj:"Biro Keuangan dan BMN",wk:"Semester II",ik:"Buku saku PSP; laporan Klinik BMN"},
{id:"R2",keg:KEG[4],ev:"Terkendalanya proses mencari dokumen/berkas/arsip fisik maupun digital",kat:"Layanan",ad:AD[4],cause:"Belum ada acuan penulisan kode klasifikasi arsip dan SDM pengelola arsip belum dilatih",impact:"Proses mendapatkan informasi terhambat dan waktu pengambilan keputusan bertambah",ctrl:"Permen PUPR 16/PRT/M/2018 tentang Pola Klasifikasi Arsip",hn:HN[1],l:5,i:3,resp:RESP[0],rj:"Penguatan",ru:"1. Regulasi Klasifikasi Arsip dan JRA 2. Bimtek kearsipan",rs:["Man","Method"],l2:2,i2:3,pj:"Kepala Biro Umum",wk:"Jan–Des 2026",ik:"Regulasi KA dan JRA disahkan; laporan bimtek"},
{id:"R3",keg:KEG[7],ev:"Manipulasi data presensi pegawai dalam sistem kehadiran MyPKP",kat:"Korupsi: Perbuatan Curang",cause:"Masih terdapat celah dalam proses verifikasi data presensi",impact:"Tunjangan kinerja dibayarkan tidak sesuai kehadiran",ctrl:"Presensi elektronik berbasis foto (belum ada pengenalan wajah)",hn:HN[1],l:4,i:3,resp:RESP[0],rj:"Penguatan",bk:BK[1],pc:PC[1],ad:AD[0],ru:"1. Fitur Face Recognition pada MyPKP 2. Fitur monitoring presensi pada akun administrator",rs:["Machine","Method"],l2:3,i2:2,pj:"Kepala Pusat Data dan Informasi",wk:"1 Apr–31 Des 2026",ik:"Fitur FR aktif; laporan monitoring",sp:"Pengelolaan presensi dan perhitungan tunjangan kinerja",ph:"Pegawai Kementerian PKP",ab:"Laporan",js:"Kapabilitas",rf:"Pola presensi identik atau anomali"}
].map(dflt)}
function sv(l,i){return M[l-1][i-1]}function lv(s){return s>=20?5:s>=16?4:s>=11?3:s>=6?2:1}
function s1(r){return sv(r.l,r.i)}function s2(r){return sv(r.l2,r.i2)}
function isK(r){return r.kat.indexOf("Korupsi")==0}
function pill(s){return '<span class="pill L'+lv(s)+'">'+s+' · '+LN[lv(s)]+'</span>'}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nid(u){u=u||S.me.unit;return u.toUpperCase()+"-R"+(S.risks.filter(function(r){return r.unit==u}).reduce(function(m,r){return Math.max(m,parseInt(String(r.id).split("-R").pop())||0)},0)+1)}
function opts(a,v,off){return a.map(function(x,i){var val=off?i+1:x;return '<option value="'+esc(val)+'"'+(String(val)==String(v)?" selected":"")+'>'+(off?(i+1)+" – ":"")+esc(x)+'</option>'}).join("")}
function katOpts(v){return '<optgroup label="Risiko Umum">'+opts(KU,v)+'</optgroup><optgroup label="Risiko Korupsi">'+opts(KK.map(function(x){return "Korupsi: "+x}),v)+'</optgroup>'}
function setTab(t){S.tab=t;render()}
function render(){
if(!S.ready){document.getElementById("app").innerHTML='<p class="empty">Memuat…</p>';return}
if(!S.me){loginV();return}
document.body.className=ADM()?"adm":"";
document.getElementById("ub").innerHTML='<span class="mu">Masuk sebagai <b style="color:var(--tx)">'+esc(S.me.name)+'</b> · '+(ADM()?"Admin (pemantau)":"Unit kerja (input)")+'</span><button class="btn s sm" onclick="out()">Keluar</button>';
var tabs=[["dash","Dashboard"],["reg","Register Risiko"],["sort","Penyortiran"],["prop","Usulan Profil Risiko"],["mon","Pemantauan Level"],["bd","BDKK"],["ctx","Konteks & Kriteria"],["acc","Akun & Unit"]];
tabs=tabs.filter(function(t){return ADM()||"dash,reg,bd".indexOf(t[0])>=0});
document.getElementById("sub").textContent="Unit: "+S.c.unit+(ADM()?"":" › "+un(S.me.unit))+" · Periode "+S.c.per+" · Merujuk ISO 31000:2018 dan SE Dirjen TKPR No. 03/SE/Dt/2026";
document.getElementById("nav").innerHTML=tabs.map(function(t){return '<button class="'+(S.tab==t[0]?"on":"")+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
document.getElementById("app").innerHTML={dash:dash,reg:reg,sort:sort,prop:prop,mon:mon,bd:bd,ctx:ctx,acc:acc}[S.tab]()}
function dash(){
var R=vis(),c1=[0,0,0,0,0,0],c2=[0,0,0,0,0,0];R.forEach(function(r){c1[lv(s1(r))]++;c2[lv(s2(r))]++});
var n=function(s){return R.filter(function(r){return r.status==s}).length};
var h=(ADM()?fbar()+usum():"")+'<div class="kpis"><div class="kpi"><b>'+R.length+'</b><span>Total risiko</span></div><div class="kpi"><b>'+R.filter(isK).length+'</b><span>Risiko korupsi</span></div><div class="kpi"><b>'+n("baru")+'</b><span>Menunggu penyortiran</span></div><div class="kpi"><b>'+n("usul")+'</b><span>Diusulkan</span></div><div class="kpi"><b>'+n("ajuan")+'</b><span>Menunggu verifikasi</span></div><div class="kpi"><b>'+n("profil")+'</b><span>Ditetapkan di profil</span></div></div>';
h+='<div class="cols"><div class="card"><h2>Peta Risiko 5×5</h2><div class="hm"><div class="ax"></div><div class="ax" style="grid-column:2/7">DAMPAK</div>';
for(var l=5;l>=1;l--){h+='<div class="ax">'+l+'<br>'+LK[l-1]+'</div>';for(var i=1;i<=5;i++){
var ch=R.filter(function(r){return r.l==l&&r.i==i}).map(function(r){return '<span class="ch">'+r.id+'<sup>1</sup></span>'}).concat(R.filter(function(r){return r.l2==l&&r.i2==i}).map(function(r){return '<span class="ch">'+r.id+'<sup>2</sup></span>'})).join("");
var sel=S.cell&&S.cell[0]==l&&S.cell[1]==i;h+='<div class="c L'+lv(sv(l,i))+(sel?" sel":"")+'"'+(sv(l,i)<=S.th?' style="box-shadow:inset 0 0 0 3px #7030a0"':'')+' onclick="pick('+l+','+i+')">'+ch+'<span class="sc">'+sv(l,i)+'</span></div>'}}
h+='<div class="ax"></div>';for(var j=1;j<=5;j++)h+='<div class="ax">'+j+'<br>'+DP[j-1]+'</div>';
h+='</div><p class="mu">Sumbu Y: kemungkinan (K). Sumbu X: dampak (D). Angka di sel = besaran risiko. <sup>1</sup> setelah pengendalian, <sup>2</sup> diharapkan setelah RTP. Klik sel untuk melihat daftar. Bingkai ungu = area dalam selera risiko (garis toleransi, nilai ≤ '+S.th+').</p></div>';
h+='<div class="card"><h2>Tingkat Risiko (setelah pengendalian → diharapkan)</h2>';
for(var k=5;k>=1;k--){var w=R.length?c1[k]/R.length*100:0;h+='<p><span class="pill L'+k+'" style="min-width:120px;text-align:center">'+LN[k]+'</span> <span class="bar L'+k+'" style="width:'+Math.max(w,1)*1.4+'px"></span> <b>'+c1[k]+'</b> → <b>'+c2[k]+'</b></p>'}
h+='<h3>Per Kategori</h3>';var cat={};R.forEach(function(r){cat[r.kat]=(cat[r.kat]||0)+1});
Object.keys(cat).forEach(function(k){h+='<p class="mu" style="margin:2px 0">'+esc(k)+': <b style="color:var(--tx)">'+cat[k]+'</b></p>'});
h+='</div></div>';
if(S.cell){var m=R.filter(function(r){return (r.l==S.cell[0]&&r.i==S.cell[1])||(r.l2==S.cell[0]&&r.i2==S.cell[1])});h+='<div class="card"><h2>Risiko pada sel K'+S.cell[0]+' × D'+S.cell[1]+' (nilai '+sv(S.cell[0],S.cell[1])+')</h2>'+(m.length?tbl(m,false):'<p class="empty">Tidak ada risiko.</p>')+'</div>'}
return h+chk(R)}
function pick(l,i){S.cell=(S.cell&&S.cell[0]==l&&S.cell[1]==i)?null:[l,i];render()}
function tbl(L,act){
return '<div class="tw"><table><tr><th>ID</th>'+(ADM()?'<th>Unit</th>':'')+'<th>Risiko</th><th>Kategori</th><th>Pengendalian</th><th>Setelah pengendalian</th><th>Diharapkan</th><th>PJ RTP</th><th>Status</th>'+(act?'<th></th>':'')+'</tr>'+L.map(function(r){return '<tr><td>'+r.id+'</td>'+(ADM()?'<td>'+esc(un(r.unit))+'</td>':'')+'<td><b>'+esc(r.ev)+'</b><br><span class="mu">'+esc(r.keg)+'<br>Penyebab: '+esc(r.cause)+'<br>Dampak: '+esc(r.impact)+'</span></td><td>'+esc(r.kat)+'</td><td>'+esc(r.ctrl||"-")+'<br><span class="mu">'+esc(r.hn)+'</span></td><td>K'+r.l+'×D'+r.i+' '+pill(s1(r))+'</td><td>K'+r.l2+'×D'+r.i2+' '+pill(s2(r))+'</td><td>'+esc(r.pj)+'<br><span class="mu">'+esc(r.wk)+'</span></td><td><span class="st">'+STAT[r.status]+'</span></td>'+(act?'<td><div class="row"><button class="btn s sm" onclick="ed(\''+r.id+'\')">Ubah</button><button class="btn d sm" onclick="del(\''+r.id+'\')">Hapus</button></div></td>':'')+'</tr>'}).join("")+'</table></div>'}
function I(id,lb,v){return '<div><label>'+lb+'</label><input id="f_'+id+'" value="'+esc(v)+'"></div>'}
function T(id,lb,v){return '<div><label>'+lb+'</label><textarea id="f_'+id+'">'+esc(v)+'</textarea></div>'}
function Sx(id,lb,o,ch){return '<div><label>'+lb+'</label><select id="f_'+id+'"'+(ch?' onchange="'+ch+'"':'')+'>'+o+'</select></div>'}
function reg(){
if(ADM())return '<div class="card"><h2>Register Risiko Seluruh Unit ('+vis().length+')</h2><p class="mu">Mode pantau: input dilakukan oleh masing-masing unit kerja.</p></div>'+fbar()+'<div class="card">'+(vis().length?tbl(vis(),false):'<p class="empty">Belum ada risiko.</p>')+'</div>';
var e=dflt(S.edit?S.risks.filter(function(r){return r.id==S.edit})[0]:{});
var h='<div class="card"><h2>'+(S.edit?"Ubah risiko "+S.edit:"Input Risiko Baru")+'</h2><p class="mu">Isian mengikuti kolom Profil Risiko. Nilai risiko mengikuti matriks 5×5 pada tab Konteks &amp; Kriteria.</p>';
h+='<h3>A. Konteks &amp; identifikasi</h3><div class="grid">'+Sx("keg","Kegiatan utama",opts(KEG,e.keg))+Sx("kat","Kategori risiko",katOpts(e.kat),"tk()")+Sx("ad","Area dampak",opts(AD,e.ad))+Sx("sum","Sumber identifikasi",opts(SUM,e.sum))+'</div><div class="grid" style="margin-top:12px">'+T("ev","Pernyataan risiko",e.ev)+T("cause","Penyebab",e.cause)+T("impact","Dampak",e.impact)+'</div>';

function un(id){var m=S.units.filter(function(x){return x.id==id})[0];return m?m.name:(id||"-")}
function mu(p){p=(p||"").toLowerCase();var m=S.units.filter(function(x){return p.indexOf(x.name.toLowerCase())>=0})[0];return m?m.id:""}
function vis(){return S.risks.filter(function(r){return ADM()?(!S.fu||r.unit==S.fu):r.unit==S.me.unit})}
function vb(b){return ADM()?(!S.fu||b.unit==S.fu):b.unit==S.me.unit}
function sha(s){s="rr|"+s;if(window.crypto&&crypto.subtle)return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")});return Promise.resolve(btoa(unescape(encodeURIComponent(s))))}
async function defCfg(){var us=[{id:"admin",role:"admin",name:"Administrator",h:await sha("admin:Admin@2026")}],un2=[];
for(var k=0;k<UN.length;k++){var a=UN[k];un2.push({id:a[0],name:a[1]});us.push({id:a[0],role:"unit",unit:a[0],name:a[1],h:await sha(a[0]+":"+a[0]+"@2026")})}
return{users:us,units:un2}}
function er(e){console.error(e);if(!ERR){ERR=1;alert("Data belum tersimpan ke server: "+((e&&e.message)||e)+". Pastikan Anda membuka halaman lewat tautan yang diberi akses ubah.")}}
function wu(id){var f=function(x){return x.unit==id};DB.doc("units/"+id).set({risks:S.risks.filter(f),bd:S.bd.filter(f)}).catch(er)}
function wc(){DB.doc("config/main").set({users:S.users,units:S.units,th:S.th,c:S.c}).catch(er)}
function save(u){try{
if(!DB){localStorage.setItem(KEY2,JSON.stringify({risks:S.risks,bd:S.bd,th:S.th,c:S.c,users:S.users,units:S.units}));return}
if(!S.me)return;if(u===undefined)u=ADM()?"cfg":S.me.unit;
if(u=="cfg")wc();else if(u=="*")S.units.forEach(function(x){wu(x.id)});else if(u)wu(u)}catch(e){er(e)}}
function add(d){if(!d.exists)return;var x=d.data()||{};(x.risks||[]).forEach(function(r){r.unit=d.id;S.risks.push(dflt(r))});(x.bd||[]).forEach(function(b){b.unit=d.id;S.bd.push(b)})}
function ref(){var a=document.activeElement;if(S.me&&a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;render()}
function sub(){US.forEach(function(f){f()});US=[];S.risks=[];S.bd=[];if(!DB||!S.me)return;
if(ADM())US.push(DB.collection("units").onSnapshot(function(q){S.risks=[];S.bd=[];q.docs.forEach(add);ref()},er));
else US.push(DB.doc("units/"+S.me.unit).onSnapshot(function(d){S.risks=[];S.bd=[];add(d);ref()},er))}
function rs(){if(S.me)return;try{var id=sessionStorage.getItem("rr_me"),u=S.users.filter(function(x){return x.id==id})[0];if(u){S.me=u;sub()}}catch(e){}}
async function boot(){
var d=await defCfg();S.users=d.users;S.units=d.units;
try{if(window.claude&&claude.use)DB=await Promise.race([claude.use("db"),new Promise(function(r){setTimeout(function(){r(null)},8000)})])}catch(e){DB=null}
if(DB){setTimeout(function(){if(!S.ready){S.ready=1;rs();render()}},10000);
DB.doc("config/main").onSnapshot(function(s){if(s.exists){var x=s.data();S.cfgOk=1;S.users=x.users||S.users;S.units=x.units||S.units;S.th=x.th||S.th;S.c=Object.assign(S.c,x.c||{})}if(!S.ready){S.ready=1;rs()}ref()},function(e){S.ready=1;ref()})}
else{load();try{var l=JSON.parse(localStorage.getItem(KEY2)||"null");if(l&&l.risks){S.risks=l.risks.map(dflt);S.bd=l.bd||[];S.th=l.th||S.th;S.c=Object.assign(S.c,l.c||{});S.users=l.users||S.users;S.units=l.units||S.units}}catch(e){}
S.risks.forEach(function(r){if(!r.unit)r.unit=mu(r.pj)});S.ready=1;rs();render()}
render()}
function loginV(){document.getElementById("sub").textContent="Silakan masuk untuk melanjutkan";document.getElementById("nav").innerHTML="";document.getElementById("ub").innerHTML="";
document.getElementById("app").innerHTML='<div class="card" style="max-width:400px;margin:24px auto"><h2>Masuk</h2><label>Masuk sebagai</label><select id="lg_u"><option value="admin">Administrator (pemantau)</option>'+S.units.map(function(x){return '<option value="'+esc(x.id)+'"'+(location.hash=="#"+x.id?" selected":"")+'>'+esc(x.name)+' (input)</option>'}).join("")+'</select><label style="margin-top:10px">Kata sandi</label><input id="lg_p" type="password" onkeydown="if(event.key===\'Enter\')doLogin()"><p id="lg_e" style="color:#d33a3a;font-size:13px;margin:8px 0 0;min-height:18px"></p><button class="btn" style="margin-top:6px" onclick="doLogin()">Masuk</button></div>'}
async function doLogin(){var id=document.getElementById("lg_u").value,pw=document.getElementById("lg_p").value,u=S.users.filter(function(x){return x.id==id})[0];
if(!u||u.h!=await sha(id+":"+pw)){document.getElementById("lg_e").textContent="Kata sandi salah.";return}
S.me=u;S.tab="dash";S.fu="";S.cell=null;S.edit=null;try{sessionStorage.setItem("rr_me",id)}catch(e){}
sub();if(DB&&ADM()&&!S.cfgOk)save("cfg");render()}
function out(){US.forEach(function(f){f()});US=[];S.me=null;if(DB){S.risks=[];S.bd=[]}try{sessionStorage.removeItem("rr_me")}catch(e){}render()}
function fbar(){return '<div class="card"><div class="row"><label style="margin:0">Filter unit kerja</label><select style="max-width:360px" onchange="S.fu=this.value;render()"><option value="">Semua unit</option>'+S.units.map(function(x){return '<option value="'+esc(x.id)+'"'+(S.fu==x.id?" selected":"")+'>'+esc(x.name)+'</option>'}).join("")+'</select></div></div>'}
function usum(){var R=S.risks;return '<div class="card"><h2>Rekap Input per Unit Kerja</h2><div class="tw"><table><tr><th>Unit kerja</th><th>Total risiko</th><th>Korupsi</th><th>Di atas selera</th><th>Menunggu penyortiran</th><th>Diusulkan</th><th>Ditetapkan</th></tr>'+S.units.map(function(x){var L=R.filter(function(r){return r.unit==x.id}),c=function(f){return L.filter(f).length};return '<tr><td>'+esc(x.name)+'</td><td><b>'+L.length+'</b></td><td>'+c(isK)+'</td><td>'+c(function(r){return s1(r)>S.th})+'</td><td>'+c(function(r){return r.status=="baru"})+'</td><td>'+c(function(r){return r.status=="usul"})+'</td><td>'+c(function(r){return r.status=="profil"})+'</td></tr>'}).join("")+'</table></div></div>'}
function acc(){
var h='<div class="card"><h2>Akun &amp; Unit Kerja</h2><p class="mu">Admin memantau seluruh unit. Setiap unit kerja hanya dapat menginput dan melihat data unitnya sendiri. Kata sandi awal: admin → Admin@2026; unit → [ID]@2026 (contoh keu@2026). Segera ubah.</p><div class="tw"><table><tr><th>Peran</th><th>Akun</th><th>Risiko</th><th></th></tr>'+S.users.map(function(u){return '<tr><td>'+(u.role=="admin"?"Admin":"Unit kerja")+'</td><td><b>'+esc(u.name)+'</b><br><span class="mu">ID: '+esc(u.id)+'</span></td><td>'+(u.role=="admin"?"-":S.risks.filter(function(r){return r.unit==u.id}).length)+'</td><td><div class="row"><button class="btn s sm" onclick="rp(\''+u.id+'\')">Ubah sandi</button>'+(u.role=="unit"?'<button class="btn d sm" onclick="du(\''+u.id+'\')">Hapus</button>':'')+'</div></td></tr>'}).join("")+'</table></div></div>';
h+='<div class="card"><h2>Tambah Unit Kerja</h2><div class="grid">'+I("nu","Nama unit","")+I("ni","ID akun (huruf kecil/angka, 2–12 karakter)","")+I("np","Kata sandi awal (min. 6)","")+'</div><div style="margin-top:12px"><button class="btn" onclick="au()">Tambah unit</button></div></div>';
var d=leg();if(DB&&d&&!localStorage.getItem("rr_imp"))h+='<div class="card"><h2>Impor Data Lama</h2><p class="mu">Ditemukan '+d.risks.length+' risiko dari versi sebelumnya di browser ini. Risiko dicocokkan ke unit lewat kolom PJ RTP; yang tidak cocok masuk ke '+esc(un(S.units[0]&&S.units[0].id))+'.</p><button class="btn s" onclick="imp()">Impor ke server</button></div>';
var B="https://claude.ai/artifact/AfhxA3dP4bEqxdUCYsaDJq";h+='<div class="card"><h2>Tautan Akses per Unit Kerja</h2><p class="mu">Setiap tautan membuka halaman masuk dengan unit yang sudah terpilih; unit tinggal mengisi kata sandi. Bagikan tautan halaman ini dengan izin yang memungkinkan unit mengubah isi.</p><div class="tw"><table><tr><th>Unit kerja</th><th>Tautan</th></tr>'+S.units.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td><code>'+B+'#'+esc(x.id)+'</code></td></tr>'}).join("")+'</table></div></div>';
return h}
function leg(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");return d&&d.risks&&d.risks.length?d:null}catch(e){return null}}
function imp(){var d=leg();if(!d)return;var uu={};d.risks.forEach(function(r){r=dflt(r);r.unit=mu(r.pj)||S.units[0].id;r.id=nid(r.unit);S.risks.push(r);uu[r.unit]=1});(d.bd||[]).forEach(function(b){b.unit=S.units[0].id;S.bd.push(b);uu[b.unit]=1});Object.keys(uu).forEach(function(k){save(k)});try{localStorage.setItem("rr_imp","1")}catch(e){}render()}
function rp(id){dlg("Kata sandi baru untuk "+un(id)+" (min. 6 karakter):",1,async function(p){if(p.length<6){alert("Minimal 6 karakter.");return}var h=await sha(id+":"+p);S.users.forEach(function(u){if(u.id==id)u.h=h});save("cfg");alert("Kata sandi berhasil diperbarui.")})}
function du(id){dlg("Hapus unit "+un(id)+" beserta seluruh datanya?",0,function(){S.users=S.users.filter(function(u){return u.id!=id});S.units=S.units.filter(function(u){return u.id!=id});S.risks=S.risks.filter(function(r){return r.unit!=id});S.bd=S.bd.filter(function(b){return b.unit!=id});save("cfg");if(DB)DB.doc("units/"+id).delete().catch(er);render()})}
async function au(){var n=g("nu"),i=g("ni").toLowerCase(),p=g("np");if(!n||!/^[a-z0-9]{2,12}$/.test(i)||p.length<6){alert("Lengkapi nama unit, ID akun (huruf kecil/angka 2–12 karakter), dan kata sandi minimal 6 karakter.");return}
if(S.users.some(function(u){return u.id==i})){alert("ID akun sudah dipakai.");return}
S.units.push({id:i,name:n});S.users.push({id:i,role:"unit",unit:i,name:n,h:await sha(i+":"+p)});save("cfg");render()}
function dlg(msg,inp,cb){var d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px";d.innerHTML='<div class="card" style="max-width:380px;width:100%;margin:0"><p style="margin-top:0">'+esc(msg)+'</p>'+(inp==1?'<input id="dg_i" type="password">':'')+'<div class="row" style="margin-top:12px"><button class="btn" id="dg_o">OK</button>'+(inp==-1?'':'<button class="btn s" id="dg_c">Batal</button>')+'</div></div>';document.body.appendChild(d);var i=d.querySelector("#dg_i");if(i){i.focus();i.onkeydown=function(e){if(e.key==="Enter")d.querySelector("#dg_o").click()}}var c=d.querySelector("#dg_c");if(c)c.onclick=function(){d.remove()};d.querySelector("#dg_o").onclick=function(){var v=i?i.value:true;d.remove();cb(v)}}
window.alert=function(m){dlg(String(m),-1,function(){})};
function clr(){dlg("Hapus semua data risiko dan kejadian?",0,function(){S.risks=[];S.bd=[];save("*");render()})}
window.addEventListener("hashchange",function(){if(!S.me&&S.ready)render()});
boot();
</script>
